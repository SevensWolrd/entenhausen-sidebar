<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entenhausen - Premium Chess Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar-container">
        <!-- Header -->
        <header class="club-header">
            <h1 class="gold-text">🦆 Entenhausen</h1>
            <p class="subtitle">Der Premium Chess Club</p>
        </header>

        <!-- Live Statistiken -->
        <section class="stats-section">
            <div class="stat-box">
                <span class="stat-value" id="member-count">...</span>
                <span class="stat-label">Mitglieder</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="daily-rating">...</span>
                <span class="stat-label">Tages-Rating</span>
            </div>
        </section>

        <!-- Bevorstehende Turniere aus Config -->
        <section id="custom-tournaments-section" style="display: none; margin-bottom: 25px;">
            <h2 class="section-title">🔜 Anstehende Events</h2>
            <div id="custom-tournaments-container"></div>
        </section>

        <!-- Automatische Team-Matches (Gegen andere Clubs) -->
        <section class="matches-section">
            <h2 class="section-title">🏆 Club-Matches</h2>
            <div id="matches-container" class="loading">
                Turnierdaten werden von Chess.com geladen...
            </div>
        </section>

        <!-- Ansprechpartner -->
        <section class="admin-section">
            <h2 class="section-title">👑 Ansprechpartner</h2>
            <div id="admin-container" class="admin-card"></div>
        </section>

        <!-- Clubziele -->
        <section class="goals-section">
            <h2 class="section-title">💎 Unsere Ziele</h2>
            <ul id="club-goals" class="goals-list"></ul>
        </section>

        <div id="club-news" class="club-news-banner" style="display: none;"></div>

        <section id="partner-section" class="partner-section" style="display: none;">
            <h2 class="section-title">🤝 Partner</h2>
            <div id="partner-container" class="partner-links"></div>
        </section>
    </div>
    
    <script>
        const CLUB_SLUG = 'entenhausen'; 

        async function initDashboard() {
            try {
                const timestamp = new Date().getTime();
                
                const clubRes = await fetch(`https://api.chess.com/pub/club/${CLUB_SLUG}?v=${timestamp}`);
                if (!clubRes.ok) throw new Error("Club nicht gefunden");
                
                const clubData = await clubRes.json();
                
                document.getElementById('member-count').textContent = clubData.members_count || '0';
                document.getElementById('daily-rating').textContent = clubData.average_daily_rating || '-';
                
                const matchesRes = await fetch(`https://api.chess.com/pub/club/${CLUB_SLUG}/matches?v=${timestamp}`);
                const matchesData = await matchesRes.json();
                
                renderMatches(matchesData);
            } catch (error) {
                console.error("Daten-Fehler:", error);
                document.getElementById('matches-container').innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Daten konnten nicht geladen werden.</p>';
            }
        }

        function renderMatches(data) {
            const container = document.getElementById('matches-container');
            container.innerHTML = ''; 

            const upcoming = data.registered || [];
            const inProgress = data.in_progress || [];
            const activeMatches = [...upcoming, ...inProgress].slice(0, 3);

            if (activeMatches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">Aktuell keine Club-gegen-Club Matches.</p>';
                return;
            }

            activeMatches.forEach(match => {
                const opponentParts = match.opponent.split('/');
                const opponentName = opponentParts[opponentParts.length - 1].replace(/-/g, ' ');

                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => window.open(match.url, '_blank');
                
                const isNext = match.status === 'registration';
                card.innerHTML = `
                    <p class="match-title">vs. <span style="text-transform: capitalize;">${opponentName}</span></p>
                    <p class="match-meta" style="${isNext ? 'color: #4CAF50; font-weight: bold;' : ''}">${isNext ? 'Registrierung läuft 🟢' : 'Match läuft ⚔️'}</p>
                `;
                container.appendChild(card);
            });
        }

        async function loadAdmin() {
            try {
                const res = await fetch('https://api.chess.com/pub/player/kissenschlach');
                if (!res.ok) return;
                const adminData = await res.json();
                
                document.getElementById('admin-container').innerHTML = `
                    <a href="${adminData.url}" target="_blank" class="admin-link">
                        <img src="${adminData.avatar || 'https://www.chess.com/bundles/web/images/user-image.svg'}" alt="Kissenschlach" class="admin-avatar">
                        <div class="admin-info">
                            <span class="admin-name">Kissenschlach</span>
                            <span class="admin-role">Club Leitung</span>
                        </div>
                    </a>
                `;
            } catch (error) {}
        }

        async function loadConfig() {
            try {
                const res = await fetch(`config.json?v=${new Date().getTime()}`);
                const config = await res.json();

                // 1. Manuelle Turniere laden (mit neuem Design)
                const tourneySection = document.getElementById('custom-tournaments-section');
                const tourneyContainer = document.getElementById('custom-tournaments-container');
                
                if (config.upcoming_tournaments && config.upcoming_tournaments.length > 0) {
                    tourneySection.style.display = "block";
                    tourneyContainer.innerHTML = "";
                    config.upcoming_tournaments.forEach(t => {
                        const card = document.createElement('a');
                        card.href = t.url;
                        card.target = "_blank"; 
                        card.className = 'custom-tourney-card';
                        
                        // Das neue, angepasste Event-Design
                        card.innerHTML = `
                            <span class="custom-tourney-title">${t.title}</span>
                            <div class="custom-tourney-details">
                                <span>⚡ ${t.format}</span>
                                <span>📅 ${t.date}</span>
                            </div>
                            <div class="join-button">Teilnehmen</div>
                        `;
                        
                        tourneyContainer.appendChild(card);
                    });
                } else {
                    tourneySection.style.display = "none";
                }

                // Ziele
                const goalsContainer = document.getElementById('club-goals');
                if (config.goals) {
                    goalsContainer.innerHTML = ""; 
                    config.goals.forEach(goal => {
                        const li = document.createElement('li');
                        li.textContent = goal;
                        goalsContainer.appendChild(li);
                    });
                }

            } catch (error) {}
        }

        initDashboard();
        loadAdmin();
        loadConfig();
    </script>
</body>
</html>
